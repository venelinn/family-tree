[package]
name = "app"
version = "0.1.0"
description = "A local, offline family tree"
authors = ["Venelin Nikolov"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `protocol-asset` is what serves photos to the webview: an absolute path
# rewritten by `convertFileSrc` is only loadable with it on.
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# The matching feature keeps asset-protocol grants, not just fs ones, across
# a restart — otherwise photos go blank the second time the app is opened.
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }
